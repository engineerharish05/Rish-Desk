name: Safely validate Claude integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out integration branch only
        uses: actions/checkout@v4
        with:
          ref: integration/claude-ready-to-launch
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify patch is present and applies cleanly
        run: |
          set -euo pipefail
          test -f rish-deskdroid-complete.patch || {
            echo "::error::The patch file is missing from the integration branch."
            exit 1
          }
          git apply --check rish-deskdroid-complete.patch

      - name: Apply patch
        run: git apply --whitespace=nowarn rish-deskdroid-complete.patch

      - name: Ensure critical project files remain present
        run: |
          set -euo pipefail
          test -f gradlew
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f .github/workflows/build.yml
          chmod +x ./gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Build release variant
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rish-Deskdroid-integrated-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK output
        uses: actions/upload-artifact@v4
        with:
          name: Rish-Deskdroid-integrated-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated integration to integration branch only
        run: |
          set -euo pipefail
          rm -f rish-deskdroid-complete.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Integrate Claude implementation after successful builds"
          git push origin HEAD:integration/claude-ready-to-launch
